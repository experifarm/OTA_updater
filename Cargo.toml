[package]
name = "ota_updater"
version = "0.1.0"
edition = "2024"
description = "Broadcast OTA updater: bsdiff-style diff, Reed-Solomon FEC, Ed25519-signed manifests over UDP multicast"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
ed25519-dalek = "3"
getrandom = "0.4.3"
sha2 = "0.11"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
zstd = "0.14.2"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

# Dependencies (zstd, sha2, ed25519) are hot paths; keep them fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3

# Suffix sorting and RS coding are slow unoptimised; tests exercise multi-hundred-KiB images.
[profile.test]
opt-level = 2
